<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millestone</title>
  <style>
    :root { --fs: 1; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    input, textarea { user-select: text; }
    body {
      background-color: #ffffff;
      color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark {
      background-color: #121212;
      color: #ffffff;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 72px;
      border-bottom: 1px solid #e0e0e0;
      transition: border-color 0.3s, background-color 0.3s;
    }
    body.dark nav {
      border-bottom-color: #2e2e2e;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .nav-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: background-color 0.2s, color 0.2s;
    }
    .nav-icon-btn:hover {
      background-color: rgba(0, 0, 0, 0.07);
    }
    body.dark .nav-icon-btn {
      color: #aaa;
    }
    body.dark .nav-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .nav-icon-btn svg {
      width: 22px;
      height: 22px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
      gap: 24px;
      height: calc(100vh - 72px);
      overflow-y: auto;
    }

    .settings-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .settings-section h2 {
      font-size: calc(13px * var(--fs, 1));
      font-weight: 600;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .settings-label {
      font-size: calc(14px * var(--fs, 1));
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-action {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      font-size: calc(13px * var(--fs, 1));
      color: inherit;
      transition: background-color 0.15s;
    }
    .btn-action:hover { background-color: rgba(0,0,0,0.06); }
    body.dark .btn-action { border-color: #444; }
    body.dark .btn-action:hover { background-color: rgba(255,255,255,0.08); }

    .status-badge {
      font-size: calc(12px * var(--fs, 1));
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .status-badge.ok   { background: #e6f4ea; color: #2d7a3a; }
    .status-badge.fail { background: #fce8e6; color: #c5221f; }
    .status-badge.idle { background: #f1f1f1; color: #888; }
    body.dark .status-badge.ok   { background: #1e3a26; color: #6fcf97; }
    body.dark .status-badge.fail { background: #3a1e1e; color: #eb5757; }
    body.dark .status-badge.idle { background: #2a2a2a; color: #888; }

    .font-scale-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .btn-font-scale {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      font-size: calc(12px * var(--fs, 1));
      color: inherit;
      transition: background-color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-font-scale:hover { background-color: rgba(0,0,0,0.06); }
    .btn-font-scale.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }
    body.dark .btn-font-scale { border-color: #444; }
    body.dark .btn-font-scale:hover { background-color: rgba(255,255,255,0.08); }
    body.dark .btn-font-scale.active {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    /* 현재 페이지 아이콘 강조 */
    .nav-icon-btn.current { color: #f5a623; }
    body.dark .nav-icon-btn.current { color: #ffc246; }

    /* 종료 버튼 */
    #shutdown-btn { color: #e0453a; }
    #shutdown-btn:hover { background-color: rgba(224,69,58,.1) !important; color: #c0392b; }
    body.dark #shutdown-btn { color: #eb5757; }
    body.dark #shutdown-btn:hover { background-color: rgba(235,87,87,.12) !important; color: #ff6b6b; }

    .btn-danger {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid #e0b0b0;
      background: none;
      cursor: pointer;
      font-size: calc(13px * var(--fs, 1));
      color: #c0392b;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-danger:hover { background-color: rgba(192,57,43,0.08); border-color: #c0392b; }
    body.dark .btn-danger { border-color: #6b2c2c; color: #e07070; }
    body.dark .btn-danger:hover { background-color: rgba(224,112,112,0.1); border-color: #e07070; }

    .provider-tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-provider {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      font-size: calc(13px * var(--fs, 1));
      color: inherit;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-provider:hover { background-color: rgba(0,0,0,0.06); }
    .btn-provider.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }
    body.dark .btn-provider { border-color: #444; }
    body.dark .btn-provider:hover { background-color: rgba(255,255,255,0.08); }
    body.dark .btn-provider.active {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    .api-key-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: calc(13px * var(--fs, 1));
      background: none;
      color: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .api-key-input:focus { border-color: #888; }
    body.dark .api-key-input { border-color: #444; background: #1e1e1e; }
    body.dark .api-key-input:focus { border-color: #aaa; }

    .pkg-install-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 4px;
    }
    .pkg-status-badge {
      font-size: calc(12px * var(--fs, 1));
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
      background: #f1f1f1;
      color: #888;
    }
    .pkg-status-badge.ok   { background: #e6f4ea; color: #2d7a3a; }
    .pkg-status-badge.fail { background: #fce8e6; color: #c5221f; }
    body.dark .pkg-status-badge       { background: #2a2a2a; color: #888; }
    body.dark .pkg-status-badge.ok   { background: #1e3a26; color: #6fcf97; }
    body.dark .pkg-status-badge.fail { background: #3a1e1e; color: #eb5757; }

  </style>
</head>

  <main>
    <div class="settings-section">
      <h2>데이터</h2>
      <div class="settings-row">
        <span class="settings-label">전체 데이터 초기화</span>
        <button class="btn-danger" id="btn-reset-data" onclick="resetData()">초기화</button>
      </div>
    </div>

    <div class="settings-section">
      <h2>폰트 크기</h2>
      <div class="font-scale-row">
        <button class="btn-font-scale" data-scale="0.8">아주 작게</button>
        <button class="btn-font-scale" data-scale="0.9">작게</button>
        <button class="btn-font-scale" data-scale="1.0">중간</button>
        <button class="btn-font-scale" data-scale="1.15">크게</button>
        <button class="btn-font-scale" data-scale="1.3">아주 크게</button>

    </div>

    <div class="settings-section">
      <h2>AI 프로바이더</h2>
      <div class="provider-tabs" id="provider-tabs">
        <button class="btn-provider" data-provider="claude_cli">Claude CLI</button>
        <button class="btn-provider" data-provider="claude_api">Claude API</button>
        <button class="btn-provider" data-provider="openai">GPT-4o</button>
        <button class="btn-provider" data-provider="gemini">Gemini API</button>
        <button class="btn-provider" data-provider="gemini_cli">Gemini CLI</button>
        <button class="btn-provider" data-provider="ollama_cli">Ollama CLI</button>
      </div>
      <div id="api-key-row" style="display:none; width:100%; max-width:400px; flex-direction:column; gap:6px;">
        <label id="api-key-label" style="font-size:calc(12px * var(--fs,1)); color:#888; text-align:center;"></label>
        <div class="pkg-install-row" id="pkg-install-row">
          <button class="btn-action" id="btn-install-pkg" onclick="installPackage()">패키지 설치</button>
          <span class="pkg-status-badge" id="pkg-status-badge">미확인</span>
        </div>
        <input type="password" id="api-key-input" class="api-key-input" placeholder="API 키를 입력하세요">
      </div>
      <div id="ollama-model-row" style="display:none; width:100%; max-width:400px; flex-direction:column; gap:6px;">
        <label style="font-size:calc(12px * var(--fs,1)); color:#888; text-align:center;">Ollama 모델 이름</label>
        <input type="text" id="ollama-model-input" class="api-key-input" placeholder="llama3.2">
      </div>
      <div style="width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <button class="btn-action" id="btn-save-provider" onclick="saveProvider()" style="width:100%; padding:8px 0;">저장</button>

    </div>

    <div class="settings-section" id="claude-cli-check" style="display:none;">
      <h2>Claude CLI 연결 확인</h2>
      <div class="settings-row">
        <span class="settings-label">연결 상태</span>
        <button class="btn-action" id="btn-check-cli" onclick="checkCli()">연결 확인</button>
        <span class="status-badge idle" id="cli-status">미확인</span>

    <div class="settings-section" id="gemini-cli-check" style="display:none;">

        <span class="settings-label">연결 상태</span>
        <button class="btn-action" id="btn-check-gemini" onclick="checkGemini()">연결 확인</button>
        <span class="status-badge idle" id="gemini-status">미확인</span>

          ch.from.p@gmail.com

  <script>
    function _sendHeartbeat() { fetch('/api/heartbeat', { method: 'POST' }).catch(() => {}); }
    setInterval(_sendHeartbeat, 3000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') _sendHeartbeat(); });
    window.addEventListener('focus', _sendHeartbeat);

    const STORAGE_KEY = 'settings.theme';
    const DEFAULT_THEME = 'light';
    const FONT_SCALE_KEY = 'settings.fontScale';
    const DEFAULT_FONT_SCALE = '1.0';

    function applyFontScale(scale) {
      document.documentElement.style.setProperty('--fs', scale);
    }

    function loadFontScale() {
      return localStorage.getItem(FONT_SCALE_KEY) || DEFAULT_FONT_SCALE;
    }

    function initFontScaleUI() {
      const current = loadFontScale();
      document.querySelectorAll('.btn-font-scale').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scale === current);
        btn.addEventListener('click', () => {
          const scale = btn.dataset.scale;
          localStorage.setItem(FONT_SCALE_KEY, scale);
          applyFontScale(scale);
          document.querySelectorAll('.btn-font-scale').forEach(b =>
            b.classList.toggle('active', b === btn)
          );
        });
      });
    }

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark', isDark);
      document.getElementById('icon-moon').style.display = isDark ? 'none' : '';
      document.getElementById('icon-sun').style.display  = isDark ? ''     : 'none';
    }

    function loadTheme() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved !== null ? saved : DEFAULT_THEME;
    }

    applyTheme(loadTheme());

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark');
      const next = isDark ? 'light' : 'dark';
      localStorage.setItem(STORAGE_KEY, next);
      applyTheme(next);
    });
    applyFontScale(loadFontScale());
    initFontScaleUI();

    async function resetData() {
      if (!confirm('모든 데이터가 삭제됩니다. 정말 초기화할까요?')) return;
      const btn = document.getElementById('btn-reset-data');
      btn.disabled = true;
      try {
        await fetch('/api/workspaces', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workspaces: [] })
        });
        alert('초기화 완료.');
      } catch {
        alert('초기화 실패: 서버 오류');
      } finally {
        btn.disabled = false;
      }
    }

    async function checkGemini() {
      const btn = document.getElementById('btn-check-gemini');
      const badge = document.getElementById('gemini-status');
      const versionEl = document.getElementById('gemini-version');

      btn.disabled = true;
      badge.className = 'status-badge idle';
      badge.textContent = '확인 중…';
      versionEl.textContent = '';

      try {
        const res = await fetch('/api/gemini-check');
        const data = await res.json();
        if (data.ok) {
          badge.className = 'status-badge ok';
          badge.textContent = '연결됨';
          versionEl.textContent = data.version;
        } else {
          badge.className = 'status-badge fail';
          badge.textContent = '연결 실패';
          versionEl.textContent = data.error;
        }
      } catch {
        badge.className = 'status-badge fail';
        badge.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }

    async function checkCli() {
      const btn = document.getElementById('btn-check-cli');
      const badge = document.getElementById('cli-status');
      const versionEl = document.getElementById('cli-version');

      btn.disabled = true;
      badge.className = 'status-badge idle';
      badge.textContent = '확인 중…';
      versionEl.textContent = '';

      try {
        const res = await fetch('/api/claude-check');
        const data = await res.json();
        if (data.ok) {
          badge.className = 'status-badge ok';
          badge.textContent = '연결됨';
          versionEl.textContent = data.version;
        } else {
          badge.className = 'status-badge fail';
          badge.textContent = '연결 실패';
          versionEl.textContent = data.error;
        }
      } catch {
        badge.className = 'status-badge fail';
        badge.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }

    async function checkOllama() {
      const btn = document.getElementById('btn-check-ollama');
      const badge = document.getElementById('ollama-status');
      const versionEl = document.getElementById('ollama-version');

      btn.disabled = true;
      badge.className = 'status-badge idle';
      badge.textContent = '확인 중…';
      versionEl.textContent = '';

      try {
        const res = await fetch('/api/ollama-check');
        const data = await res.json();
        if (data.ok) {
          badge.className = 'status-badge ok';
          badge.textContent = '연결됨';
          versionEl.textContent = data.version;
        } else {
          badge.className = 'status-badge fail';
          badge.textContent = '연결 실패';
          versionEl.textContent = data.error;
        }
      } catch {
        badge.className = 'status-badge fail';
        badge.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }

    // ── AI 프로바이더 ──────────────────────────────────────
    const PROVIDER_LABELS = {
      claude_cli: null,
      claude_api: 'Anthropic API 키 (sk-ant-...)',
      openai: 'OpenAI API 키 (sk-...)',
      gemini: 'Google Gemini API 키',
      gemini_cli: null,
      ollama_cli: null
    };

    let _currentSettings = { ai_provider: 'claude_cli', api_keys: { openai: '', anthropic: '', gemini: '' }, ollama_model: '' };
    let _selectedProvider = 'claude_cli';

    function _providerToKeyName(provider) {
      return { claude_api: 'anthropic', openai: 'openai', gemini: 'gemini' }[provider] || null;
    }

    function _updateProviderUI(provider) {
      _selectedProvider = provider;
      document.querySelectorAll('.btn-provider').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.provider === provider)
      );
      const keyRow = document.getElementById('api-key-row');
      const label = document.getElementById('api-key-label');
      const input = document.getElementById('api-key-input');
      const keyName = _providerToKeyName(provider);
      if (keyName) {
        keyRow.style.display = 'flex';
        label.textContent = PROVIDER_LABELS[provider];
        input.value = _currentSettings.api_keys[keyName] || '';
        // 패키지 설치 상태 리셋
        const pkgBtn = document.getElementById('btn-install-pkg');
        const pkgBadge = document.getElementById('pkg-status-badge');
        pkgBtn.style.display = '';
        pkgBtn.disabled = false;
        pkgBtn.textContent = '패키지 설치';
        pkgBadge.className = 'pkg-status-badge';
        pkgBadge.textContent = '미확인';
      } else {
        keyRow.style.display = 'none';
        input.value = '';
      }
      const ollamaRow = document.getElementById('ollama-model-row');
      if (provider === 'ollama_cli') {
        ollamaRow.style.display = 'flex';
        document.getElementById('ollama-model-input').value = _currentSettings.ollama_model || '';
      } else {
        ollamaRow.style.display = 'none';
      }
      document.getElementById('claude-cli-check').style.display = provider === 'claude_cli' ? '' : 'none';
      document.getElementById('gemini-cli-check').style.display = provider === 'gemini_cli' ? '' : 'none';
      document.getElementById('ollama-cli-check').style.display = provider === 'ollama_cli' ? '' : 'none';
      document.getElementById('provider-save-msg').textContent = '';
    }

    async function loadProviderSettings() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        _currentSettings = { ...data, ollama_model: data.ollama_model || '' };
        _updateProviderUI(data.ai_provider || 'claude_cli');
      } catch {
        // 서버 미연결 상태에서도 UI는 초기값으로 표시
        _updateProviderUI('claude_cli');
      }
    }

    async function installPackage() {
      const btn = document.getElementById('btn-install-pkg');
      const badge = document.getElementById('pkg-status-badge');
      btn.disabled = true;
      btn.textContent = '설치 중…';
      badge.className = 'pkg-status-badge';
      badge.textContent = '설치 중…';
      try {
        const res = await fetch('/api/install-package', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: _selectedProvider }),
        });
        const data = await res.json();
        if (data.success) {
          badge.className = 'pkg-status-badge ok';
          badge.textContent = '설치 완료';
          btn.style.display = 'none';
        } else {
          badge.className = 'pkg-status-badge fail';
          badge.textContent = '설치 실패';
          btn.textContent = '패키지 설치';
          btn.disabled = false;
        }
      } catch {
        badge.className = 'pkg-status-badge fail';
        badge.textContent = '오류';
        btn.textContent = '패키지 설치';
        btn.disabled = false;
      }
    }

    async function saveProvider() {
      const btn = document.getElementById('btn-save-provider');
      const msg = document.getElementById('provider-save-msg');
      btn.disabled = true;
      msg.textContent = '저장 중…';

      const keyName = _providerToKeyName(_selectedProvider);
      const updatedKeys = { ..._currentSettings.api_keys };
      if (keyName) {
        updatedKeys[keyName] = document.getElementById('api-key-input').value.trim();
      }

      const payload = { ai_provider: _selectedProvider, api_keys: updatedKeys };
      if (_selectedProvider === 'ollama_cli') {
        payload.ollama_model = document.getElementById('ollama-model-input').value.trim() || 'llama3.2';
      }

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          _currentSettings.ai_provider = _selectedProvider;
          _currentSettings.api_keys = updatedKeys;
          if (_selectedProvider === 'ollama_cli') _currentSettings.ollama_model = payload.ollama_model;
          msg.textContent = '저장됨';
          setTimeout(() => { msg.textContent = ''; }, 2000);
        } else {
          msg.textContent = '저장 실패';
        }
      } catch {
        msg.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }

    document.querySelectorAll('.btn-provider').forEach(btn => {
      btn.addEventListener('click', () => _updateProviderUI(btn.dataset.provider));
    });

    loadProviderSettings();

    // ── 언어 설정 ──────────────────────────────────────────
    async function loadLanguageSetting() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        const lang = data.language || 'ko';
        ['ko', 'en', 'vi'].forEach(l =>
          document.getElementById('lang-' + l).classList.toggle('active', l === lang)
        );
      } catch {}
    }

    async function setLanguage(lang) {
      ['ko', 'en', 'vi'].forEach(l =>
        document.getElementById('lang-' + l).classList.toggle('active', l === lang)
      );
      const msg = document.getElementById('lang-save-msg');
      try {
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: lang }),
        });
        msg.textContent = '저장됨';
        setTimeout(() => { msg.textContent = ''; }, 2000);
      } catch {
        msg.textContent = '저장 실패';
      }
    }

    loadLanguageSetting();

    function restartOnboarding() {
      localStorage.removeItem('onboarding.done');
      location.replace('onboarding.html');
    }

    document.getElementById('shutdown-btn').addEventListener('click', () => {
      if (!confirm('서버를 종료할까요?')) return;
      const isDark = document.body.classList.contains('dark');
      const bg = isDark ? '#121212' : '#ffffff';
      const fg = isDark ? '#555' : '#bbb';
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
          height:100vh;font-family:sans-serif;background:${bg};color:${fg};gap:8px;">
          <div style="font-size:15px;">서버를 종료하는 중…</div>
        </div>`;
      navigator.sendBeacon('/api/shutdown', '');
      window.close();
    });
  </script>
</body>
</html>
