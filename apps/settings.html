<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millestone</title>
  <style>
    :root { --fs: 1; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      width: 100vw;
      height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark {
      background-color: #121212;
      color: #ffffff;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 72px;
      border-bottom: 1px solid #e0e0e0;
      transition: border-color 0.3s, background-color 0.3s;
    }
    body.dark nav {
      border-bottom-color: #2e2e2e;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .nav-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: background-color 0.2s, color 0.2s;
    }
    .nav-icon-btn:hover {
      background-color: rgba(0, 0, 0, 0.07);
    }
    body.dark .nav-icon-btn {
      color: #aaa;
    }
    body.dark .nav-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .nav-icon-btn svg {
      width: 22px;
      height: 22px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
      gap: 24px;
    }

    .settings-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .settings-section h2 {
      font-size: calc(13px * var(--fs, 1));
      font-weight: 600;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .settings-label {
      font-size: calc(14px * var(--fs, 1));
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-action {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      font-size: calc(13px * var(--fs, 1));
      color: inherit;
      transition: background-color 0.15s;
    }
    .btn-action:hover { background-color: rgba(0,0,0,0.06); }
    body.dark .btn-action { border-color: #444; }
    body.dark .btn-action:hover { background-color: rgba(255,255,255,0.08); }

    .status-badge {
      font-size: calc(12px * var(--fs, 1));
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .status-badge.ok   { background: #e6f4ea; color: #2d7a3a; }
    .status-badge.fail { background: #fce8e6; color: #c5221f; }
    .status-badge.idle { background: #f1f1f1; color: #888; }
    body.dark .status-badge.ok   { background: #1e3a26; color: #6fcf97; }
    body.dark .status-badge.fail { background: #3a1e1e; color: #eb5757; }
    body.dark .status-badge.idle { background: #2a2a2a; color: #888; }

    .font-scale-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .btn-font-scale {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      font-size: calc(12px * var(--fs, 1));
      color: inherit;
      transition: background-color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-font-scale:hover { background-color: rgba(0,0,0,0.06); }
    .btn-font-scale.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }
    body.dark .btn-font-scale { border-color: #444; }
    body.dark .btn-font-scale:hover { background-color: rgba(255,255,255,0.08); }
    body.dark .btn-font-scale.active {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

  </style>
</head>
<body>
  <nav>
    <!-- 아이콘 버튼 (왼쪽) -->
    <div class="nav-left">
      <!-- 구름 -->
      <button class="nav-icon-btn" title="구름" aria-label="구름">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        </svg>
      </button>
      <!-- 번개 -->
      <button class="nav-icon-btn" title="번개" aria-label="번개">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </button>
      <!-- 전구 -->
      <button class="nav-icon-btn" title="전구" aria-label="전구">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="9" y1="18" x2="15" y2="18"/>
          <line x1="10" y1="22" x2="14" y2="22"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
        </svg>
      </button>
      <!-- 설정 (현재 페이지) -->
      <button class="nav-icon-btn" title="설정" aria-label="설정">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
            a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
            A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06
            A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
            A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06
            A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
            a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06
            A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
            a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <!-- 나가기 버튼 (오른쪽) -->
    <div class="nav-right">
      <button class="nav-icon-btn" title="나가기" aria-label="나가기" onclick="location.href='main.html'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <main>
    <div class="settings-section">
      <h2>폰트 크기</h2>
      <div class="font-scale-row">
        <button class="btn-font-scale" data-scale="0.8">아주 작게</button>
        <button class="btn-font-scale" data-scale="0.9">작게</button>
        <button class="btn-font-scale" data-scale="1.0">중간</button>
        <button class="btn-font-scale" data-scale="1.15">크게</button>
        <button class="btn-font-scale" data-scale="1.3">아주 크게</button>
      </div>
    </div>

    <div class="settings-section">
      <h2>Gemini CLI</h2>
      <div class="settings-row">
        <span class="settings-label">연결 상태</span>
        <button class="btn-action" id="btn-check-gemini" onclick="checkGemini()">연결 확인</button>
        <span class="status-badge idle" id="gemini-status">미확인</span>
      </div>
      <div id="gemini-version" style="font-size:calc(12px * var(--fs, 1)); color:#888; text-align:center;"></div>
    </div>

    <div class="settings-section">
      <h2>Claude CLI</h2>
      <div class="settings-row">
        <span class="settings-label">연결 상태</span>
        <button class="btn-action" id="btn-check-cli" onclick="checkCli()">연결 확인</button>
        <span class="status-badge idle" id="cli-status">미확인</span>
      </div>
      <div id="cli-version" style="font-size:calc(12px * var(--fs, 1)); color:#888; text-align:center;"></div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'settings.theme';
    const DEFAULT_THEME = 'light';
    const FONT_SCALE_KEY = 'settings.fontScale';
    const DEFAULT_FONT_SCALE = '1.0';

    function applyFontScale(scale) {
      document.documentElement.style.setProperty('--fs', scale);
    }

    function loadFontScale() {
      return localStorage.getItem(FONT_SCALE_KEY) || DEFAULT_FONT_SCALE;
    }

    function initFontScaleUI() {
      const current = loadFontScale();
      document.querySelectorAll('.btn-font-scale').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scale === current);
        btn.addEventListener('click', () => {
          const scale = btn.dataset.scale;
          localStorage.setItem(FONT_SCALE_KEY, scale);
          applyFontScale(scale);
          document.querySelectorAll('.btn-font-scale').forEach(b =>
            b.classList.toggle('active', b === btn)
          );
        });
      });
    }

    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
    }

    function loadTheme() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved !== null ? saved : DEFAULT_THEME;
    }

    applyTheme(loadTheme());
    applyFontScale(loadFontScale());
    initFontScaleUI();

    async function checkGemini() {
      const btn = document.getElementById('btn-check-gemini');
      const badge = document.getElementById('gemini-status');
      const versionEl = document.getElementById('gemini-version');

      btn.disabled = true;
      badge.className = 'status-badge idle';
      badge.textContent = '확인 중…';
      versionEl.textContent = '';

      try {
        const res = await fetch('/api/gemini-check');
        const data = await res.json();
        if (data.ok) {
          badge.className = 'status-badge ok';
          badge.textContent = '연결됨';
          versionEl.textContent = data.version;
        } else {
          badge.className = 'status-badge fail';
          badge.textContent = '연결 실패';
          versionEl.textContent = data.error;
        }
      } catch {
        badge.className = 'status-badge fail';
        badge.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }

    async function checkCli() {
      const btn = document.getElementById('btn-check-cli');
      const badge = document.getElementById('cli-status');
      const versionEl = document.getElementById('cli-version');

      btn.disabled = true;
      badge.className = 'status-badge idle';
      badge.textContent = '확인 중…';
      versionEl.textContent = '';

      try {
        const res = await fetch('/api/claude-check');
        const data = await res.json();
        if (data.ok) {
          badge.className = 'status-badge ok';
          badge.textContent = '연결됨';
          versionEl.textContent = data.version;
        } else {
          badge.className = 'status-badge fail';
          badge.textContent = '연결 실패';
          versionEl.textContent = data.error;
        }
      } catch {
        badge.className = 'status-badge fail';
        badge.textContent = '서버 오류';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
